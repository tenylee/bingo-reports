<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嘀嗒清单集成报告</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.6;
    padding: 40px 20px;
  }
  
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  
  /* Header */
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #1d1d1f;
    margin-bottom: 8px;
  }
  
  .header .subtitle {
    font-size: 14px;
    color: #86868b;
  }
  
  /* Tab Bar */
  .tab-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  
  .tab-btn {
    padding: 10px 24px;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    background: white;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: #6b7280;
    transition: all 0.2s;
  }
  
  .tab-btn:hover { background: #f9fafb; }
  .tab-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-color: transparent;
  }
  
  /* Report Frame */
  .report-frame {
    width: 100%;
    height: 950px;
    border: none;
    border-radius: 12px;
    background: white;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  
  .divider {
    width: 60px;
    height: 4px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 2px;
    margin: 0 auto 24px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>📋 嘀嗒清单集成报告</h1>
    <p class="subtitle">Bingo × 嘀嗒清单 · 2026年5月19日</p>
  </div>
  
  <div class="divider"></div>
  
  <div class="tab-bar">
    <button class="tab-btn active" onclick="showTab('v1', this)">v1 简版（只看结果）</button>
    <button class="tab-btn" onclick="showTab('v2', this)">v2 完整版（含失败过程）</button>
  </div>
  
  <iframe id="report-frame" class="report-frame" src="https://tenylee.github.io/bingo-reports/v1.html"></iframe>
  
  <script>
    function showTab(tab, btn) {
      document.getElementById('report-frame').src = 'https://tenylee.github.io/bingo-reports/' + tab + '.html';
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
    }
  </script>

</div>
</body>
</html>
